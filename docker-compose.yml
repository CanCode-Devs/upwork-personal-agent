services:
  warmup:
    build: .
    command: ["python", "-m", "app.cli.warmup_embeddings"]
    env_file:
      - .env
    environment:
      HF_HOME: /models/huggingface
      HUGGINGFACE_HUB_CACHE: /models/huggingface/hub
      HF_HUB_CACHE: /models/huggingface/hub
      TRANSFORMERS_CACHE: /models/huggingface/transformers
      SENTENCE_TRANSFORMERS_HOME: /models/huggingface/sentence-transformers
    volumes:
      - ./data/huggingface:/models/huggingface
    restart: "no"

  app:
    build: .
    depends_on:
      warmup:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8000:8000"
      - "127.0.0.1:8765:8765"
    env_file:
      - .env
    environment:
      BIND_HOST: "0.0.0.0"
      BIND_PORT: "8000"
      DATABASE_URL: "sqlite:///./data/app.db"
      DATA_DIR: "./data"
      OAUTH_REDIRECT_HOST: "127.0.0.1"
      OAUTH_REDIRECT_PORT: "8765"
      POLL_INTERVAL_MINUTES: ${POLL_INTERVAL_MINUTES:-5}
      HF_HOME: /models/huggingface
      HUGGINGFACE_HUB_CACHE: /models/huggingface/hub
      HF_HUB_CACHE: /models/huggingface/hub
      TRANSFORMERS_CACHE: /models/huggingface/transformers
      SENTENCE_TRANSFORMERS_HOME: /models/huggingface/sentence-transformers
    volumes:
      - ./app:/app/app
      - ./alembic:/app/alembic
      - ./data:/app/data
      - ./profiles:/app/profiles
      - ./data/huggingface:/models/huggingface
    restart: unless-stopped

